<!DOCTYPE html>
<html>
<head>
  <title>Our Spiritual Community</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f4f8; }
    h1 { color: #2c3e50; }
    .card { background: white; padding: 20px; margin: 15px auto; border-radius: 10px; max-width: 500px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, textarea { width: 90%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Welcome to Our Fellowship</h1>
  <div class="card">
    <h2>🙏 Word of Encouragement</h2>
    <p>Replace this text with a scripture or a message to share with your colleagues.</p>
  </div>
  <div class="card">
    <h2>📅 Meeting Times</h2>
    <p>We meet every [Day] at [Time].</p>
  </div>
</body>
</html>
